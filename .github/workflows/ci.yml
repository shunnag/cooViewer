# KaitoKit と Washi は別リポジトリで、兄弟チェックアウトが無いとビルドが失敗する。
# macos-26 は現行の安定版、xcode-27 は開発機と同じ Xcode を検査する。
# Washi では「開発機でしか通らない/CI でしか落ちない」問題が両方向で起きた実績があるため、
# 2 つのランナーを回してツールチェーン間の差異を検出する。
# Sparkle・XADMaster・UniversalDetector・KaitoKit・Washi の各フレームワークは
# Run Script フェーズが自動で組み立てるため、ソースの取得以外に事前手順は不要。

name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, xcode-27]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Clone KaitoKit and Washi
        run: |
          git clone --depth 1 --branch main https://github.com/shunnag/KaitoKit.git ../KaitoKit
          git clone --depth 1 --branch main https://github.com/shunnag/Washi.git ../Washi

      - name: Log toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        run: xcodebuild -project CooViewer.xcodeproj -scheme cooViewer -configuration Debug build

      - name: Test
        run: xcodebuild -project CooViewer.xcodeproj -scheme cooViewer -configuration Debug test -destination 'platform=macOS'
