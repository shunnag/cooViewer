# KaitoKit と Washi は別リポジトリで、兄弟チェックアウトが無いとビルドが失敗する。
# macos-26 は現行の安定版、xcode-27 は開発機と同じ Xcode を検査する。
# Washi では「開発機でしか通らない/CI でしか落ちない」問題が両方向で起きた実績があるため、
# 2 つのランナーを回してツールチェーン間の差異を検出する。
# Sparkle・KaitoKit・Washi の各フレームワークは
# Run Script フェーズが自動で組み立てるため、ソースの取得以外に事前手順は不要。

name: CI

on:
  push:
    branches: [master]
  pull_request:
  # 固定した依存版でもランナーやツールチェーンの更新による破損を検出するため、
  # 手動と定期でも実行する。
  workflow_dispatch:
  schedule:
    - cron: '17 21 * * 1'

# この workflow は token を使わない。
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    env:
      KAITOKIT_REF: v0.17.0
      WASHI_REF: 1.25.0
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, xcode-27]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check appcast signature comment
        run: |
          if grep -q 'sparkle-sign-warning' appcast.xml; then
            grep -q 'sparkle-signatures:' appcast.xml
          elif grep -q 'sparkle-signatures:' appcast.xml; then
            echo "::warning::Signed appcast is missing the Sparkle warning comment."
          else
            echo "::warning::appcast.xml is unsigned; sign it before releasing signed-feed clients."
          fi

      - name: Fetch pinned KaitoKit and Washi
        run: |
          checkout_ref() {
            local name="$1" ref="$2"
            git init "../$name"
            git -C "../$name" remote add origin "https://github.com/shunnag/$name.git"
            # タグの実体も残し、フレームワークの版とソース revision を導出できるようにする。
            if ! git -C "../$name" fetch --depth 1 origin "+refs/tags/$ref:refs/tags/$ref"; then
              git -C "../$name" fetch --depth 1 origin "$ref"
            fi
            git -C "../$name" checkout --detach FETCH_HEAD
            echo "$name ($ref): $(git -C "../$name" rev-parse HEAD)"
          }
          checkout_ref KaitoKit "$KAITOKIT_REF"
          checkout_ref Washi "$WASHI_REF"

      - name: Log toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        run: xcodebuild -project CooViewer.xcodeproj -scheme cooViewer -configuration Debug build

      - name: Test
        run: xcodebuild -project CooViewer.xcodeproj -scheme cooViewer -configuration Debug test -destination 'platform=macOS'
