# KaitoKit と Washi は別リポジトリ。固定版を一時領域へ取得し、各ビルダへ場所を渡す。
# macos-26 は現行の安定版、xcode-27 は開発機と同じ Xcode を検査する。
# Washi では「開発機でしか通らない/CI でしか落ちない」問題が両方向で起きた実績があるため、
# 2 つのランナーを回してツールチェーン間の差異を検出する。
# Sparkle・KaitoKit・Washi の各フレームワークは
# Run Script フェーズが自動で組み立てるため、ソースの取得以外に事前手順は不要。

name: CI

on:
  push:
    branches: [master]
  pull_request:
  # 固定した依存版でもランナーやツールチェーンの更新による破損を検出するため、
  # 手動と定期でも実行する。
  workflow_dispatch:
  schedule:
    - cron: '17 21 * * 1'

# PR では新しい push が古い run を取り消す。push・手動・定期の run は取り消さない。
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  # PR の merge checkout と同じ tree を検査済みの場合だけ、push の重複検査を省く。
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.decide.outputs.full }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # 文書のみ・検査済み tree でも appcast の検査は毎回行う。
      - name: Check appcast signature comment
        run: |
          if grep -q 'sparkle-sign-warning' appcast.xml; then
            grep -q 'sparkle-signatures:' appcast.xml
          elif grep -q 'sparkle-signatures:' appcast.xml; then
            echo "::warning::Signed appcast is missing the Sparkle warning comment."
          else
            echo "::warning::appcast.xml is unsigned; sign it before releasing signed-feed clients."
          fi
      # PR は merge-base から head、push は before から今回の commit までの全差分を見る。
      # 取得失敗・空差分・新規ブランチでは文書のみと判定せず、全 CI に戻す。
      - name: Classify changed paths
        id: paths
        continue-on-error: true
        timeout-minutes: 2
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          docs_only=false
          classify() {
            local checked_sha diff_range path changed=false
            case "$EVENT:$REF" in
              pull_request:*) ;;
              push:refs/heads/master) ;;
              *) return ;;
            esac
            checked_sha="$(git rev-parse HEAD)" || return
            [ "$checked_sha" = "$SHA" ] || return
            if [ "$EVENT" = pull_request ]; then
              [[ "$PR_BASE" =~ ^[0-9a-f]{40}$ && "$PR_HEAD" =~ ^[0-9a-f]{40}$ ]] || return
              diff_range="$PR_BASE...$PR_HEAD"
            else
              [[ "$BEFORE" =~ ^[0-9a-f]{40}$ && "$BEFORE" != 0000000000000000000000000000000000000000 ]] || return
              diff_range="$BEFORE..$SHA"
            fi
            # rename の旧パスも検査し、コードから文書への移動で検査を省かない。
            git diff --no-renames --name-only -z "$diff_range" -- > "$RUNNER_TEMP/ci-changed-paths" || return
            while IFS= read -r -d '' path; do
              changed=true
              case "$path" in
                .github/*|appcast.xml) return ;;
                Documentation/*|*.md|.beads/*|LICENSE*) ;;
                *) return ;;
              esac
            done < "$RUNNER_TEMP/ci-changed-paths"
            [ "$changed" = true ] || return
            docs_only=true
          }
          classify || true
          printf 'docs_only=%s\n' "$docs_only" >> "$GITHUB_OUTPUT"
      - name: Look up a successful PR for the same tree
        id: lookup
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          skip=false
          reason="event=$EVENT: 全 CI"
          lookup() {
            if [ "$EVENT" != push ] || [ "$REF" != refs/heads/master ]; then
              return
            fi
            reason="checkout の commit を確認できないため全 CI"
            local checked_sha tree pulls pr head runs id url count
            checked_sha="$(git rev-parse HEAD)" || return
            [ "$checked_sha" = "$SHA" ] || return
            tree="$(git rev-parse 'HEAD^{tree}')" || return
            reason="PR の取得に失敗したため全 CI"
            pulls="$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" --jq "[.[] | select(.merged_at != null and .merge_commit_sha == \"$SHA\") | {number, head: .head.sha}]")" || return
            reason="PR が一意でないため全 CI"
            pr="$(jq -er 'if length == 1 then .[0].number else empty end | select(type == "number" and . > 0 and . == floor)' <<< "$pulls")" || return
            head="$(jq -er '.[0].head | select(type == "string" and test("^[0-9a-f]{40}$"))' <<< "$pulls")" || return
            reason="PR run の取得に失敗したため全 CI"
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=pull_request&head_sha=$head&status=success&per_page=100" --jq '.workflow_runs[] | "\(.id) \(.html_url)"')" || return
            reason="同じ tree の検査済み記録がないため全 CI"
            while read -r id url; do
              [ -n "$id" ] || continue
              if [[ ! "$id" =~ ^[0-9]+$ ]] || [[ ! "$url" =~ ^https://github\.com/ ]]; then
                reason="PR run の応答が不正なため全 CI"
                return
              fi
              reason="検査済み記録の取得に失敗したため全 CI"
              count="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts?name=tested-tree-$tree" --jq '[.artifacts[] | select(.expired | not)] | length')" || return
              if [[ ! "$count" =~ ^[0-9]+$ ]]; then
                reason="検査済み記録の応答が不正なため全 CI"
                return
              fi
              if [ "$count" -ge 1 ]; then
                reason="tree $tree は PR #$pr の $url で全 CI 済み。heavy job を省略する。"
                skip=true
                return
              fi
              reason="同じ tree の検査済み記録がないため全 CI"
            done <<< "$runs"
          }
          lookup || true
          printf 'skip=%s\n' "$skip" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$reason" >> "$GITHUB_STEP_SUMMARY"
      # literal true と正常終了を確認してから省く。失敗・出力欠落では全 CI にする。
      - name: Decide whether to run the full CI
        id: decide
        if: always()
        env:
          DOCS_ONLY: ${{ steps.paths.outputs.docs_only }}
          PATHS_OUTCOME: ${{ steps.paths.outcome }}
          SKIP: ${{ steps.lookup.outputs.skip }}
          LOOKUP_OUTCOME: ${{ steps.lookup.outcome }}
        run: |
          set -uo pipefail
          full=true
          if [ "$PATHS_OUTCOME" = success ] && [ "$DOCS_ONLY" = true ]; then
            full=false
            printf '文書のみの変更のためビルド・テストを省略する。\n' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$LOOKUP_OUTCOME" = success ] && [ "$SKIP" = true ]; then
            full=false
          elif [ "$PATHS_OUTCOME" != success ] || [ "$LOOKUP_OUTCOME" != success ]; then
            printf 'gate の確認に失敗したため全 CI\n' >> "$GITHUB_STEP_SUMMARY"
          fi
          printf 'full=%s\n' "$full" >> "$GITHUB_OUTPUT"

  # job の if は matrix 展開前なので、必須 check 名を保つため step で省略する。
  # 省略時は Ubuntu で成功を報告し、macOS runner を確保しない。
  build-and-test:
    name: build-and-test (${{ matrix.os }})
    needs: plan
    # 省略判定を先に行い、xcode-27 は fork PR だけ hosted、それ以外は自前で実行する。
    runs-on: >-
      ${{ needs.plan.outputs.full != 'true' && 'ubuntu-latest' ||
          matrix.os == 'xcode-27' && fromJSON(
            github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository &&
            '["xcode-27"]' || '["self-hosted", "shunnag-arm64"]'
          ) || matrix.os }}
    # macos-26 の通常約 10 分に対し、hang は約 2 倍で打ち切る。
    timeout-minutes: 20
    env:
      # reopen(options:) は未リリースのためコミットを固定し、KaitoKit 0.18.0 公開時にタグへ戻す。
      KAITOKIT_REF: 914d64a41e7eeb2e813723c587e200b59c1d44b5
      WASHI_REF: 32802d985be63eb4697c882db7e71ca17f8a9113 # 次の Washi リリースでタグ指定へ戻す。
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, xcode-27]
    steps:
      - name: Skip macOS work
        if: needs.plan.outputs.full != 'true'
        run: echo 'plan の判定により macOS のビルド・テストを省略する。'
      - name: Checkout
        if: needs.plan.outputs.full == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Prepare clean build workspace
        if: needs.plan.outputs.full == 'true'
        run: |
          set -euo pipefail
          CI_SCRATCH="$RUNNER_TEMP/cooviewer-ci"
          printf 'CI_SCRATCH=%s\nKAITOKIT_SOURCE_DIR=%s/KaitoKit\nWASHI_SOURCE_DIR=%s/Washi\n' \
            "$CI_SCRATCH" "$CI_SCRATCH" "$CI_SCRATCH" >> "$GITHUB_ENV"
          # 固定 ref・Sparkle の版・ツールチェーンが変わっても前回の生成物を使わない。
          # legacy build location も除去し、今回の Xcode 出力は一時領域へ固定する。
          # Build と Test の間だけ出力を共有し、次回ジョブへは持ち越さない。
          rm -rf Frameworks build DerivedData .build cooViewer_build "$CI_SCRATCH"
          mkdir -p "$CI_SCRATCH"

      - name: Fetch pinned KaitoKit and Washi
        if: needs.plan.outputs.full == 'true'
        run: |
          set -euo pipefail
          checkout_ref() {
            local name="$1" ref="$2" source="$CI_SCRATCH/$1"
            # 永続 workspace の兄弟 checkout は使わず、ジョブ専用のソースを毎回取得する。
            rm -rf "$source"
            git init "$source"
            git -C "$source" remote add origin "https://github.com/shunnag/$name.git"
            # タグの実体も残し、フレームワークの版とソース revision を導出できるようにする。
            if ! git -C "$source" fetch --depth 1 origin "+refs/tags/$ref:refs/tags/$ref"; then
              git -C "$source" fetch --depth 1 origin "$ref"
            fi
            git -C "$source" checkout --detach FETCH_HEAD
            echo "$name ($ref): $(git -C "$source" rev-parse HEAD)"
          }
          checkout_ref KaitoKit "$KAITOKIT_REF"
          checkout_ref Washi "$WASHI_REF"

      - name: Log toolchain versions
        if: needs.plan.outputs.full == 'true'
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        if: needs.plan.outputs.full == 'true'
        run: |
          xcodebuild -project CooViewer.xcodeproj -scheme cooViewer -configuration Debug \
            -derivedDataPath "$CI_SCRATCH/DerivedData" \
            SYMROOT="$CI_SCRATCH/Products" OBJROOT="$CI_SCRATCH/Intermediates.noindex" build

      - name: Test
        if: needs.plan.outputs.full == 'true'
        run: |
          xcodebuild -project CooViewer.xcodeproj -scheme cooViewer -configuration Debug \
            -derivedDataPath "$CI_SCRATCH/DerivedData" \
            SYMROOT="$CI_SCRATCH/Products" OBJROOT="$CI_SCRATCH/Intermediates.noindex" \
            test -destination 'platform=macOS'

      - name: Clean build workspace
        if: always() && needs.plan.outputs.full == 'true'
        run: rm -rf Frameworks build DerivedData .build cooViewer_build "$RUNNER_TEMP/cooviewer-ci"

  # 文書のみで省いた PR には記録を作らず、実際に全対象が成功した merge tree だけを残す。
  record-tested-tree:
    needs: [plan, build-and-test]
    if: github.event_name == 'pull_request' && needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: tree
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          tree="$(git rev-parse 'HEAD^{tree}')"
          printf 'tree=%s\n' "$tree" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/tested-tree"
          printf 'tree %s\ncommit %s\nrun %s\n' "$tree" "$GITHUB_SHA" "$GITHUB_RUN_ID" > "$RUNNER_TEMP/tested-tree/tested-tree.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tested-tree-${{ steps.tree.outputs.tree }}
          path: ${{ runner.temp }}/tested-tree/tested-tree.txt
          if-no-files-found: error
          retention-days: 7
          overwrite: true
